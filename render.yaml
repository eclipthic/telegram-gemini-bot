services:
  - type: web
    name: telegram-gemini-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL
        value: gemini-3-flash-preview
      - key: SYSTEM_PROMPT
        value: "Ты — Clifford, умный бот для Telegram-чатов. Отвечай полезно, кратко и по делу. Отвечай на русском."